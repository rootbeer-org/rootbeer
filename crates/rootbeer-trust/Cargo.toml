[package]
name = "rootbeer-trust"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false }
rootbeer-drv = { path = "../rootbeer-drv" }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tough = { version = "0.24", default-features = false }
ureq = "3"
url = "2"

[dev-dependencies]
aws-lc-rs = "1"
jiff = "0.2"
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
