[package]
name = "rootbeer-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[features]
default = ["embedded-stdlib"]
embedded-stdlib = []

[dependencies]
age = { version = "0.12.1", default-features = false, features = ["armor"] }
rootbeer-store-legacy = { path = "../rootbeer-store-legacy" }
rootbeer-package = { path = "../rootbeer-package" }
libc = "0.2.182"
mlua = { version = "0.11.5", features = ["luau-jit", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
plist = "1"
toml = "1"
tempfile = "3"

[dev-dependencies]
flate2 = "1"
tar = "0.4"
