[package]
name = "rootbeer-bootstrap"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
data-encoding = "2"
flate2 = "1"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
ureq = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
