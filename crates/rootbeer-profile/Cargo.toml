[package]
name = "rootbeer-profile"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
rootbeer-drv = { path = "../rootbeer-drv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
