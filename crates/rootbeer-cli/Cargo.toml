[package]
name = "rootbeer-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "rb"
path = "src/main.rs"

[features]
default = ["embedded-stdlib"]
embedded-stdlib = ["rootbeer-core/embedded-stdlib"]

[dependencies]
data-encoding = "2"
clap = { version = "4.5.60", features = ["derive", "wrap_help"] }
libc = "0.2.182"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
rootbeer-core = { path = "../rootbeer-core" }
rootbeer-build = { path = "../rootbeer-build" }
rootbeer-drv = { path = "../rootbeer-drv" }
rootbeer-eval = { path = "../rootbeer-eval" }
rootbeer-sandbox = { path = "../rootbeer-sandbox" }
rootbeer-cache = { path = "../rootbeer-cache" }
rootbeer-store = { path = "../rootbeer-store" }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
