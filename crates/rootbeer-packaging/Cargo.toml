[package]
name = "rootbeer-packaging"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
base64 = "0.22"
quick-xml = "0.39"
ring = "0.17.14"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rootbeer-store-legacy = { path = "../rootbeer-store-legacy" }
rootbeer-catalog = { path = "../rootbeer-catalog" }
rootbeer-package = { path = "../rootbeer-package" }
rootbeer-build = { path = "../rootbeer-build" }
ureq = "3"
[dev-dependencies]
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
flate2 = "1"
tar = "0.4"

[build-dependencies]
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"
