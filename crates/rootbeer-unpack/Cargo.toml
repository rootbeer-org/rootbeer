[package]
name = "rootbeer-unpack"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "rb-unpack"
path = "src/main.rs"

[dependencies]
apfs = "0.4.1"
bzip2 = "0.6"
flate2 = "1"
hfsplus = "0.4.0"
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz"] }
pbzx = { version = "0.5.1", default-features = false }
quick-xml = "0.42"
rootbeer-drv = { path = "../rootbeer-drv" }
rootbeer-tree = { path = "../rootbeer-tree" }
tar = "0.4"
tempfile = "3"
udif = { version = "0.4.2", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "xz", "encoder"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
