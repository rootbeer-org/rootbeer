[package]
name = "rootbeer-unpack"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "rb-unpack"
path = "src/main.rs"

[dependencies]
apfs = "0.4.1"
bzip2 = "0.6"
flate2 = "1"
hfsplus = "0.4.0"
pbzx = { version = "0.5.1", default-features = false }
quick-xml = "0.42"
rustix = { version = "1", features = ["fs"] }
tar = "0.4"
tempfile = "3"
udif = { version = "0.4.2", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
