[package]
name = "rootbeer-drv"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json_canonicalizer = "0.3"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
