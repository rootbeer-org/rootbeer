[package]
name = "rootbeer-forge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
base64 = "0.22"
clap = { version = "4.5.60", features = ["derive", "wrap_help"] }
flate2 = "1"
rootbeer-packaging = { path = "../rootbeer-packaging" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
toml = "1"
ureq = "3"
