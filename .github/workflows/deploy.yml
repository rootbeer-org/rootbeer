name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-24.04
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Find the newest published rb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha' \
            > "$RUNNER_TEMP/rb-revision"

      - uses: rootbeer-org/setup-rb@bf50460fdf9e1b17508117150b26b624b840d08c
        with:
          revision-file: ${{ runner.temp }}/rb-revision

      - name: Install rootbeer from the signed index
        run: |
          sudo "$(command -v rb-helper)" setup "$(id -gn)"
          output=$(rb drv install rootbeer)
          mkdir release
          cp "$output/bin/rb" "$output/bin/rb-helper" release/
          echo "${output##*-rootbeer-}" > release/version

          if grep -Eqa '/opt/rb/store/[0-9a-z]{32}-' release/rb release/rb-helper; then
            echo "::error::$output references the store"
            exit 1
          fi

          reported=$(release/rb --version)
          if ! [[ $reported =~ ^rb\ [^\ ]+\ \(([0-9a-f]{12}),\ serial\ ([0-9]+)\)$ ]]; then
            echo "::error::$output says $reported, with no revision and serial"
            exit 1
          fi

          echo "${BASH_REMATCH[1]}" > release/revision
          echo "${BASH_REMATCH[2]}" > release/serial

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: release/

  sign:
    name: Sign bootstrap releases
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release
    outputs:
      is_released: ${{ steps.check.outputs.is_released }}
      version: ${{ steps.check.outputs.version }}
      serial: ${{ steps.check.outputs.serial }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts

      - name: Check the release is newer
        id: check
        run: |
          release=artifacts/release-x86_64-linux
          version=$(cat "$release/version")
          serial=$(cat "$release/serial")
          short=$(cat "$release/revision")
          for platform in aarch64-linux aarch64-macos; do
            for field in version serial revision; do
              if ! cmp -s "$release/$field" "artifacts/release-$platform/$field"; then
                echo "::error::$platform's rootbeer has another $field than x86_64-linux's"
                exit 1
              fi
            done
          done

          if ! [[ $serial =~ ^[0-9]{14}$ && $short =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::rootbeer $version has serial $serial and revision $short"
            exit 1
          fi

          revision=$(git rev-parse --verify "$short^{commit}")
          if ! git merge-base --is-ancestor "$revision" HEAD; then
            echo "::error::rootbeer $version is from $revision, which isn't on main"
            exit 1
          fi

          scripts/bootstrap-served.sh "$RUNNER_TEMP/served"
          for document in "$RUNNER_TEMP"/served/*.json; do
            [[ -e $document ]] || continue
            payload=$(jq '.payload | @base64d | fromjson' "$document")
            if (( serial <= $(jq .serial <<< "$payload") )); then
              echo "rootbeer $version (serial $serial) isn't newer than what's served"
              echo 'is_released=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            previous=$(jq -r .revision <<< "$payload")
            if ! git merge-base --is-ancestor "$previous" "$revision"; then
              echo "::error::$revision doesn't descend from the served $previous"
              exit 1
            fi
          done

          {
            echo 'is_released=true'
            echo "version=$version"
            echo "serial=$serial"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Sign
        if: steps.check.outputs.is_released == 'true'
        run: |
          if [[ -z $RB_BOOTSTRAP_KEY ]]; then
            echo "::error::the release environment has no RB_BOOTSTRAP_KEY"
            exit 1
          fi

          umask 077
          key="$RUNNER_TEMP/bootstrap.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RB_BOOTSTRAP_KEY" > "$key"
          for platform in x86_64-linux aarch64-linux aarch64-macos; do
            chmod +x "artifacts/release-$platform/rb" "artifacts/release-$platform/rb-helper"
            tar -czf "$RUNNER_TEMP/$platform.tar.gz" -C "artifacts/release-$platform" rb rb-helper
            scripts/bootstrap-sign.sh "$key" bootstrap "$platform" "$RB_SERIAL" \
              "$VERSION" "$REVISION" "$RUNNER_TEMP/$platform.tar.gz"
          done
        env:
          RB_BOOTSTRAP_KEY: ${{ secrets.RB_BOOTSTRAP_KEY }}
          RB_SERIAL: ${{ steps.check.outputs.serial }}
          VERSION: ${{ steps.check.outputs.version }}
          REVISION: ${{ steps.check.outputs.revision }}

      - name: Upload signed releases
        if: steps.check.outputs.is_released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap
          path: bootstrap

      - name: Upload the releases this replaces
        if: steps.check.outputs.is_released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous
          path: ${{ runner.temp }}/served/*.json
          if-no-files-found: ignore

  deploy:
    name: Deploy
    needs: sign
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Bootstrap releases
        run: |
          scripts/bootstrap-served.sh .vitepress/dist/bootstrap/v1
          if [[ -d artifacts/bootstrap ]]; then
            cp -R artifacts/bootstrap/. .vitepress/dist/bootstrap/v1/
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # We need to make sure previous versions of rb can relaunch into the new one
  # to avoid breaking users who have the old rb in their PATH.
  gate:
    name: Check relaunch (${{ matrix.platform }})
    needs: [sign, deploy]
    if: >-
      ${{ !cancelled() && needs.sign.result == 'success' && needs.sign.outputs.is_released == 'true' &&
      needs.deploy.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-24.04
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: previous
          path: previous

      - name: Relaunch the previous release
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.sign.outputs.version }}
          SERIAL: ${{ needs.sign.outputs.serial }}
        run: |
          if [[ ! -e previous/$PLATFORM.json ]]; then
            echo "$PLATFORM had no release before $VERSION"
            exit 0
          fi

          payload=$(jq '.payload | @base64d | fromjson' "previous/$PLATFORM.json")
          work=$(mktemp -d)
          curl -fsSL --retry 3 --max-time 300 "$(jq -r .url <<< "$payload")" -o "$work/previous.tar.gz"
          echo "$(jq -r .sha256 <<< "$payload")  $work/previous.tar.gz" | shasum -a 256 -c
          mkdir "$work/rb" "$work/root" "$work/home"
          tar -xzf "$work/previous.tar.gz" -C "$work/rb"
          chmod +x "$work/rb/rb"

          # Pages caches documents for up to ten minutes.
          deadline=$((SECONDS + 1200))
          until curl -fsSL --max-time 30 "https://rbpkg.com/bootstrap/v1/$PLATFORM.json" |
            jq -e --argjson serial "$SERIAL" '.payload | @base64d | fromjson | .serial >= $serial' > /dev/null; do
            if (( SECONDS > deadline )); then
              echo "::error::rbpkg.com never served $VERSION for $PLATFORM"
              exit 1
            fi
            sleep 30
          done

          # Every rb since the bootstrap channel relaunches on a lock schema it
          # doesn't know. ROOTBEER_ROOT keeps the old store, which an rb from
          # before /opt/rb sets up first, inside $work.
          mkdir -p "$work/home/config/rootbeer"
          : > "$work/home/config/rootbeer/init.lua"
          echo '{"schema":99,"packages":{}}' > "$work/home/config/rootbeer/rootbeer.lock"
          relaunched="so running rb $VERSION instead"
          for attempt in 1 2 3 4 5; do
            output=$(HOME="$work/home" XDG_CONFIG_HOME="$work/home/config" \
              XDG_DATA_HOME="$work/home/data" XDG_STATE_HOME="$work/home/state" \
              XDG_CACHE_HOME="$work/home/cache" ROOTBEER_ROOT="$work/root" \
              "$work/rb/rb" apply 2>&1 || true)
            echo "$output"
            if [[ $output == *"$relaunched"* &&
              ${output#*"$relaunched"} == *"no newer rb is released yet"* ]]; then
              exit 0
            fi

            if (( attempt < 5 )); then
              sleep 60
            fi
          done

          echo "::error::the previous rb didn't relaunch into a working $VERSION"
          exit 1
