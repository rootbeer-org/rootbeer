name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install Go toolchain
        uses: actions/setup-go@e626ada899467caf4efc6cfd0484b965da944ce8
        with:
          go-version: "1.27.1"
          cache: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # needrestart would restart the runner's php-fpm, which hangs for 90s
          sudo NEEDRESTART_SUSPEND=1 apt-get install -y bubblewrap apparmor-profiles
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-net --unshare-uts --die-with-parent --new-session --cap-drop ALL --ro-bind / / /bin/true

      - name: Test
        run: cargo test

      - name: Retain tested binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir dist
          for binary in rb rb-helper; do
            cp "target/${{ matrix.target }}/release/$binary" "dist/$binary-${{ matrix.target }}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: binaries-${{ matrix.target }}
          overwrite: true
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish binaries
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Attest tested binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          create-storage-record: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Push commit-pinned OCI artifacts
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            oras push "ghcr.io/$GITHUB_REPOSITORY_OWNER/rb:$GITHUB_SHA-$target" \
              --artifact-type application/vnd.rootbeer.rb.v1 \
              --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              "rb-$target" "rb-helper-$target"
          done
      # pdr's hourly run catches a missed request, and a red run here would
      # hide this commit from it.
      - name: Mint a token to ask pdr for the update
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ROOTBEER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ROOTBEER_BOT_PRIVATE_KEY }}
          owner: rootbeer-org
          repositories: pdr
          permission-actions: write
      - name: Ask pdr to package this commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run rootbeer.yml --repo rootbeer-org/pdr --field sha="$GITHUB_SHA"
